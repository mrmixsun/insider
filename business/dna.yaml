# Business DNA
# ============
# Identifies the organization context for The Insider.
# Configure once via /setup. This is Layer 0 — always-on context.
#
# This file ships as a reference example. Replace with your org's data.

name: "GEMS"
description: "Российский лидер цифровизации градостроительства. Разрабатывает GIS-платформу Geometa, упрощённый картографический инструмент Polus, а также формирует отраслевой стандарт — Концепцию информационных моделей территорий (ИМТ). 150+ сотрудников, 55 регионов, 220+ модулей."

# ──────────────────────────────────────
# Domains — thematic areas the org operates in.
# Used to classify stories and match them to audience interests.
# ──────────────────────────────────────
domains:
  - id: "gisogd"
    name: "ГИСОГД / градостроительство"
    keywords: ["ГИСОГД", "градостроительство", "территориальное планирование", "градостроительная документация", "разрешение на строительство"]
    description: "Автоматизация государственных услуг в градостроительстве"

  - id: "spatial-data"
    name: "Пространственные данные и аналитика"
    keywords: ["пространственные данные", "ГИС", "геоданные", "карты", "аналитика", "SMEV", "ЕГРН", "НСПД"]
    description: "Работа с пространственными данными, интеграции с федеральными системами"

  - id: "digital-transformation"
    name: "Цифровая трансформация стройки"
    keywords: ["цифровая трансформация", "стройка", "инвестиционно-строительный цикл", "КРТ", "административные процедуры"]
    description: "Перевод строительной отрасли с бумаги в цифру"

  - id: "imt-concept"
    name: "Концепция ИМТ"
    keywords: ["ИМТ", "информационная модель территории", "цифровая бумага", "нормативные изменения", "ГрадКодекс"]
    description: "Стандарт мышления: от PDF-архивов к машиночитаемым данным"

  - id: "public-services"
    name: "Госуслуги и сервисы для граждан"
    keywords: ["госуслуги", "услуги", "граждане", "публичные сервисы", "геопортал"]
    description: "Цифровые сервисы для граждан и бизнеса"

# ──────────────────────────────────────
# Products & Key Initiatives
# Used to tag stories with relevant product context.
# ──────────────────────────────────────
products:
  - id: "geometa"
    name: "Geometa"
    keywords: ["Geometa", "Геомета", "GISOGD-платформа", "геопортал", "витрина данных"]
    value_prop: "Платформа для управления территорией на основе данных"
    description: "Web-платформа: ГИС + пространственный анализ + электронный документооборот"

  - id: "geometa-20"
    name: "Geometa 2.0"
    keywords: ["Geometa 2.0", "REST", "микросервисы", "рефакторинг", "SaaS"]
    value_prop: "Новая архитектура — модули как независимые сервисы"
    description: "REST-модель, новое UI, разделение ядра платформы"

  - id: "polus"
    name: "Polus (Geometa.Polus)"
    keywords: ["Polus", "Полюс", "коллаборация", "карты"]
    value_prop: "Совместная работа на карте без GIS-навыков"
    description: "Упрощённая система для малого бизнеса, дизайнеров, граждан"

  - id: "gems-karty"
    name: "Gems Карты"
    keywords: ["Gems Карты", "мобильное приложение", "карты"]
    value_prop: "Мобильные карты для всех"
    description: "Мобильное приложение с картами"

  - id: "imt-initiative"
    name: "ИМТ как инициатива"
    keywords: ["ИМТ", "Концепция ИМТ", "информационная модель территории"]
    value_prop: "Отраслевой стандарт для данных о территориях"
    description: "Продвижение концепции как нормативного и технологического стандарта"

# ──────────────────────────────────────
# Strategic Priorities
# Used to filter: "does this story serve our strategy?"
# ──────────────────────────────────────
strategic_priorities:
  - "Популяризация Концепции ИМТ как отраслевого стандарта мышления"
  - "Создание спроса на решения GEMS в B2G и B2B"
  - "Формирование общественного запроса на данные о территориях (B2C)"
  - "Усиление позиции GEMS как лидера цифровизации градостроительства"

# ──────────────────────────────────────
# Vocabulary — key terms and preferred phrasings
# Used to ensure consistent language in generated content.
# ──────────────────────────────────────
vocabulary:
  preferred:
    - "информационная модель территории" # not "цифровой двойник"
    - "данные"                           # not "цифровая бумага" (for external)
    - "инвестиционно-строительный цикл"
  avoid:
    - "цифровой двойник"                 # implies 3D model, too narrow
    - "монолит"                          # negative connotation
    - "лоскутная автоматизация"          # implies failure